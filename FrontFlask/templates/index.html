<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios Simple</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <h2>Agregar Usuario</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    
    <form action="/agregar" method="post">
        <label>ID:</label>
        <input type="number" name="id" required min="1" size="5">
        
        <label>Nombre:</label>
        <input type="text" name="nombre" required minlength="3" maxlength="50">
        
        <label>Edad:</label>
        <input type="number" name="edad" required min="0" max="121" size="5">
        
        <button type="submit">Agregar</button>
    </form>

    <br><hr><br>

    <h2>Lista de Usuarios</h2>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.id }}</td>
                <td>{{ usuario.nombre }}</td>
                <td>{{ usuario.edad }}</td>
                <td>
                    <form action="/eliminar/{{ usuario.id }}" method="post" style="display:inline;">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No hay usuarios registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
